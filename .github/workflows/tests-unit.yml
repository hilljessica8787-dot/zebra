name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

# Ensures that only one workflow task will run at a time. Previous builds, if
# already in process, will get cancelled. Only the latest commit will be allowed
# to run, cancelling any workflows in between
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LIB_BACKTRACE: 1
  RUST_LOG: info
  COLORBT_SHOW_HIDDEN: 1

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unit_tests: ${{ steps.filter.outputs.unit_tests || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/path-filters.yml

  run-unit-tests:
    name: ${{ matrix.rust-version }}
    needs: changes
    if: needs.changes.outputs.unit_tests == 'true'
    permissions:
      contents: read
      id-token: write
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        rust-version: [stable, beta]
        features: [default-release-binaries]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f #v2.0.0
        with:
          toolchain: ${{ matrix.rust-version }}
          cache-key: unit-tests-${{ matrix.rust-version }}-${{ matrix.features }}
          cache-on-failure: true
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 #v2.87.17
        with:
          tool: cargo-nextest
      - uses: ./.github/actions/setup-zebra-build

      - name: Run unit tests
        run: cargo nextest run --profile ci --locked --release --features "${{ matrix.features }}" --run-ignored=all

  check-no-git-dependencies:
    name: Check no git dependencies
    needs: changes
    if: needs.changes.outputs.unit_tests == 'true' && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'A-release')
    permissions:
      contents: read
      id-token: write
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f #v2.0.0
        with:
          toolchain: stable
          cache-on-failure: true
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 #v2.87.17
        with:
          tool: cargo-nextest
      - uses: ./.github/actions/setup-zebra-build
      - name: Check no git dependencies
        run: cargo nextest run --profile check-no-git-dependencies --locked --run-ignored=only

  unit-tests:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - run-unit-tests
      - check-no-git-dependencies
    timeout-minutes: 30
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 #v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: run-unit-tests, check-no-git-dependencies
